[package]
name = "msg_inventory"
version = "0.2.0"
edition = "2024"
authors = ["ffmulks <63452434+ffmulks@users.noreply.github.com>"]
description = "Inventory system traits for converting enums into displayable inventory items"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_inventory"
keywords = ["bevy", "gamedev", "inventory", "ui", "ecs"]
categories = ["game-development", "gui"]
readme = "README.md"

[dependencies]
bevy = { version = "0.17", default-features = false }

[dev-dependencies]
bevy = { version = "0.17", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(bevy_lint)",
] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
